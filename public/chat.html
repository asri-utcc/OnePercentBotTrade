<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat - OnePercentBotTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="/css/app.css?v=2026-09-04-dlc-engine-ui" rel="stylesheet" />
  <style>
    .chat-shell {
      max-width: 980px; margin: 0 auto; padding: 0 1rem 1rem;
      display: flex; flex-direction: column; gap: 0.85rem;
    }
    .chat-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      flex-wrap: wrap;
    }
    .chat-tabs {
      display: inline-flex; gap: 0.25rem; padding: 0.25rem;
      background: rgba(255,255,255,0.04); border-radius: 8px;
    }
    .chat-tab-btn {
      padding: 0.45rem 0.9rem;
      background: transparent; border: none;
      color: var(--text-soft); cursor: pointer;
      border-radius: 6px; font-size: 0.85rem; font-weight: 500;
    }
    .chat-tab-btn:hover { color: var(--text-bright); }
    .chat-tab-btn.active {
      background: rgba(74,158,255,0.18);
      color: var(--text-bright);
    }
    .chat-pane {
      background: rgba(7,11,20,0.55);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex; flex-direction: column;
      min-height: 60vh;
      gap: 0.6rem;
    }
    .chat-pane-header {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.95rem;
    }
    .chat-pane-title { font-weight: 600; color: var(--text-bright); }
    .chat-pane-sub { color: var(--text-soft); font-size: 0.78rem; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.55rem;
      padding: 0.4rem 0.1rem;
      min-height: 320px;
      max-height: 60vh;
    }
    .chat-msg {
      max-width: 80%;
      padding: 0.5rem 0.75rem;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      align-self: flex-start;
      word-wrap: break-word;
    }
    .chat-msg.mine {
      align-self: flex-end;
      background: rgba(74,158,255,0.22);
      border: 1px solid rgba(74,158,255,0.35);
    }
    .chat-msg-meta {
      font-size: 0.7rem; color: var(--text-soft); margin-bottom: 0.2rem;
      display: flex; gap: 0.5rem; align-items: baseline;
    }
    .chat-msg-owner {
      font-size: 0.65rem; color: var(--text-soft, #6b7585);
      background: rgba(255,255,255,0.05);
      padding: 1px 6px; border-radius: 4px;
      font-family: ui-monospace, monospace;
      cursor: help;
    }
    .chat-msg-text {
      color: var(--text-bright);
      font-size: 0.88rem;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .chat-send-form {
      display: flex; gap: 0.5rem; align-items: flex-end;
    }
    #chat-send-text {
      flex: 1; min-height: 38px; max-height: 140px;
      padding: 0.5rem 0.7rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      color: var(--text-bright);
      font-family: inherit; font-size: 0.9rem;
      resize: vertical;
    }
    #chat-send-text:focus { outline: none; border-color: rgba(74,158,255,0.6); }
    #chat-send-btn {
      padding: 0.55rem 1.1rem;
      background: var(--brand-1, #4a9eff); color: #fff;
      border: none; border-radius: 8px;
      font-weight: 600; cursor: pointer;
    }
    #chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-meta-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem; color: var(--text-soft);
    }
    .chat-display-name-input {
      padding: 0.4rem 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      color: var(--text-bright);
      font-size: 0.85rem;
      max-width: 220px;
    }
    .chat-empty {
      color: var(--text-soft);
      text-align: center;
      margin: auto;
      font-size: 0.88rem;
    }
    .chat-status {
      font-size: 0.78rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
    }
    .chat-status.error { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .chat-status.info  { background: rgba(74,158,255,0.15); color: #cfe1ff; }
    .chat-status.hidden { display: none; }
    .chat-saved {
      font-size: 0.75rem;
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .chat-saved.show { opacity: 1; }
    /* ── Phase 4 chat v2 ───────────────────────────────────────── */
    .chat-msg-icon { font-size: 14px; line-height: 1; }
    .chat-msg-time-burst { font-weight: 600; color: #cfe1ff; }
    .chat-msg-flash { animation: chat-flash 1.2s ease-out 1; }
    @keyframes chat-flash {
      0%   { box-shadow: 0 0 0 4px rgba(255, 220, 60, 0.6); }
      100% { box-shadow: 0 0 0 0   rgba(255, 220, 60, 0); }
    }
    .chat-day-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 14px auto 10px; width: 80%;
      color: var(--text-soft, #8b95a5);
      font-size: 11px; letter-spacing: 0.05em;
    }
    .chat-day-divider::before,
    .chat-day-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .chat-msg-quote {
      font-size: 11px; color: var(--text-soft, #aab2c5);
      border-left: 3px solid rgba(255,255,255,0.25);
      padding: 4px 8px; margin-bottom: 4px;
      background: rgba(255,255,255,0.04); border-radius: 4px;
      cursor: pointer;
    }
    .chat-identity-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 4px 10px; background: rgba(0,0,0,0.2); border-radius: 6px;
      align-items: center; position: relative;
    }
    .chat-identity-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid;
      font-size: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .chat-identity-chip:hover { background: rgba(255,255,255,0.08); }
    .chat-identity-chip-icon { font-size: 14px; line-height: 1; }
    .chat-identity-chip-text { color: inherit; font-size: 12px; }
    .chat-identity-popover {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 100;
      background: #1a1d24; border: 1px solid var(--border-soft);
      border-radius: 10px; padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      min-width: 280px;
    }
    .chat-identity-popover.hidden { display: none; }
    .chat-popover-section { margin-bottom: 10px; }
    .chat-popover-section:last-child { margin-bottom: 0; }
    .chat-popover-label { font-size: 11px; color: var(--text-soft); margin-bottom: 6px; }
    .chat-popover-colors { display: flex; gap: 6px; flex-wrap: wrap; }
    .chat-popover-icons { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .chat-identity-block { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .chat-identity-label { font-size: 11px; color: var(--text-soft); margin-right: 4px; }
    .chat-swatch {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
    }
    .chat-icon-btn {
      width: 26px; height: 26px; border-radius: 4px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .chat-icon-btn:hover { background: rgba(255,255,255,0.12); }
    .chat-reply-banner {
      font-size: 12px; background: rgba(74,158,255,0.15);
      border: 1px solid rgba(74,158,255,0.3); color: var(--text-bright);
      padding: 6px 10px; border-radius: 6px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .chat-reply-cancel { margin-left: auto; background: transparent; border: 0; color: var(--text-soft); cursor: pointer; }
  </style>
</head>
<body>
  <nav class="app-nav" id="app-nav"></nav>

  <main class="chat-shell">
    <div class="chat-toolbar">
      <div class="chat-tabs">
        <button id="chat-tab-community" class="chat-tab-btn active" type="button">🌍 Community</button>
        <button id="chat-tab-dm" class="chat-tab-btn" type="button">📨 DM Admin</button>
      </div>
      <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
        <input id="chat-display-name-input" class="chat-display-name-input" type="text" maxlength="32" placeholder="ชื่อที่จะแสดง..." />
        <button id="chat-display-name-save" type="button" class="btn-lux btn-sm">Save Name</button>
        <span id="chat-saved-flash" class="chat-saved">✓ saved</span>
      </div>
    </div>

    <div class="chat-pane">
      <div class="chat-pane-header">
        <span class="chat-pane-title" id="chat-pane-title">🌍 Community</span>
        <span class="chat-pane-sub" id="chat-pane-sub">ทุกคนเห็น — operators + admin</span>
      </div>
      <div id="chat-status" class="chat-status hidden"></div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-identity-row" class="chat-identity-row"></div>
      <div id="chat-reply-banner" class="chat-reply-banner hidden"></div>
      <div class="chat-meta-row">
        <span id="chat-send-count">0 / 2000</span>
        <span id="chat-thread-meta"></span>
      </div>
      <form id="chat-send-form" class="chat-send-form">
        <textarea id="chat-send-text" placeholder="พิมพ์ข้อความ..." maxlength="2000"></textarea>
        <button id="chat-send-btn" type="submit">Send</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=2026-09-04-dlc-engine-ui"></script>
  <script src="/js/ws-client.js?v=2026-09-04-dlc-engine-ui"></script>
  <script>window.NAV_ACTIVE = 'chat';</script>
  <script src="/js/partials/nav.js?v=2026-09-04-dlc-engine-ui"></script>
  <script src="/js/pages/chat.js?v=2026-09-04-dlc-engine-ui"></script>
</body>
</html>
