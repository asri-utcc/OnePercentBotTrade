<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePercentBotTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="app-nav" id="app-nav"></nav>

  <div class="container py-3 py-md-4">
    <div id="content" class="text-muted-3">Loading…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ws-client.js?v=2026-08-28-fix1"></script>
  <script>
    API.get('/api/auth/me').then((me) => {
      if (!me.authenticated) {
        location.href = '/login.html';
      } else {
        document.getElementById('content').innerHTML = `
          <div class="lux-card">
            <div class="lux-body text-center" style="padding:3rem 1.5rem;">
              <h2 style="color:var(--gold-1);font-weight:800;">👋 ยินดีต้อนรับ</h2>
              <p class="text-muted-2 mt-2">เลือกเมนูด้านบนเพื่อจัดการบอท ดูกราฟ หรือทดสอบ backtest</p>
              <a href="/bots.html" class="btn btn-primary mt-3">🤖 ไปที่หน้า Bots</a>
            </div>
          </div>`;
        WSClient.start();
      }
    });
  </script>
  <script>window.NAV_ACTIVE = 'bots';</script>
  <script src="/js/partials/nav.js"></script>
  <script src="/js/partials/dailyTargetGauge.js"></script>
  <script src="/js/partials/rateLimitGauge.js"></script>
</body>
</html>
