<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePercentBotTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="/bots.html">🤖 OnePercentBotTrade</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/bots.html">Bots</a></li>
          <li class="nav-item"><a class="nav-link" href="/chart.html">Chart</a></li>
          <li class="nav-item"><a class="nav-link" href="/backtest.html">Backtest</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><span class="nav-link" id="ws-status">⚪ offline</span></li>
          <li class="nav-item"><a class="nav-link" href="#" id="logout-btn">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div id="content">
      <h1>Welcome</h1>
      <p>Loading...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ws-client.js"></script>
  <script>
    // Check session
    API.get('/api/auth/me').then((me) => {
      if (!me.authenticated) {
        location.href = '/login.html';
      } else {
        document.getElementById('content').innerHTML = `
          <div class="alert alert-info">
            <h4>👋 ยินดีต้อนรับ</h4>
            <p>เลือกเมนูด้านบนเพื่อจัดการบอท ดูกราฟ หรือทดสอบ backtest</p>
          </div>`;
        WSClient.start();
      }
    });
    document.getElementById('logout-btn').onclick = async (e) => {
      e.preventDefault();
      await API.post('/api/auth/logout', {});
      location.href = '/login.html';
    };
  </script>
</body>
</html>
