<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePercentBotTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="/css/app.css?v=2026-09-04-dlc-everywhere" rel="stylesheet" />
</head>
<body>
  <nav class="app-nav" id="app-nav"></nav>

  <div class="container py-3 py-md-4">
    <div id="content" class="text-muted-3">Loading…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=2026-09-04-dlc-everywhere"></script>
  <script src="/js/ws-client.js?v=2026-09-06-object-coerce"></script>
  <script>
    // FIX-2026-08-30: หน้าหลักคือ Chart Monitor — landing page redirect
    //   - ผู้ใช้ authenticated จะถูกส่งไปที่ /chart-monitor.html ทันที
    //   - ผู้ใช้ไม่ authenticated → /login.html (เหมือนเดิม)
    //   - WSClient.start() ถูกเรียกในหน้า Chart Monitor แทน (ไม่ต้อง start ที่นี่)
    API.get('/api/auth/me').then((me) => {
      if (!me.authenticated) {
        location.href = '/login.html';
      } else {
        location.href = '/chart-monitor.html';
      }
    });
  </script>
  <script>window.NAV_ACTIVE = 'bots';</script>

</body>
