<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backtest - OnePercentBotTrade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
  <nav class="app-nav" id="app-nav"></nav>

  <div class="container-fluid px-3 px-md-4 py-3 py-md-4">
    <div class="page-title">
      <h3>🧪 Backtest</h3>
    </div>

    <div class="lux-card mb-3">
      <div class="lux-header"><span class="title">⚙️ ตั้งค่า Backtest</span></div>
      <div class="lux-body">
        <div class="row g-2">
          <div class="col-6 col-md-2">
            <label class="form-label">คู่เทรด</label>
            <select id="b-symbol" class="form-select"></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Timeframe</label>
            <select id="b-timeframe" class="form-select">
              <option value="5m" selected>5m</option>
              <option value="15m">15m</option><option value="30m">30m</option>
              <option value="1h">1h</option><option value="2h">2h</option>
              <option value="4h">4h</option><option value="1d">1d</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">จากวันที่</label>
            <input type="date" id="b-from" class="form-control" />
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">ถึงวันที่</label>
            <input type="date" id="b-to" class="form-control" />
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label">TP %</label>
            <input type="number" id="b-tp" class="form-control" value="0.1" step="0.01" />
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label">ทุน/ไม้</label>
            <input type="number" id="b-capital" class="form-control" value="10" step="0.01" />
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label">Max ไม้</label>
            <input type="number" id="b-maxtrades" class="form-control" value="10" step="1" min="1" max="100" title="จำนวนไม้พร้อมกันสูงสุด" />
          </div>
          <div class="col-6 col-md-1 d-flex align-items-end">
            <button class="btn btn-primary w-100" id="b-run">▶ รัน</button>
          </div>
        </div>
        <div class="form-check mt-3">
          <input type="checkbox" id="b-bnb" class="form-check-input" />
          <label for="b-bnb" class="form-check-label">ใช้ BNB จ่าย fee (0.075%)</label>
        </div>
      </div>
    </div>

    <div id="result"></div>

    <div class="page-title mt-4">
      <h3>📜 Backtests ที่รันไว้</h3>
    </div>
    <div id="history"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>window.NAV_ACTIVE = 'backtest';</script>
  <script src="/js/partials/nav.js"></script>
  <script src="/js/pages/backtest.js"></script>
</body>
</html>
